name: Build Control CI

# Ordinary read-only CI for tools/build-control. Runs the module's offline
# unit tests on every pull request, mirroring ai-orchestrator-ci.yml.
#
# No `paths:` filter, deliberately: a required check with a path filter never
# reports on a PR the filter excludes and sits Pending forever. This is not a
# required check today — the exact stable check contexts to add to the
# `Protect main` ruleset (once a separate Product Owner authorisation covers
# it) are named in the Issue #1249 implementation report, and this workflow's
# job name is not among them; it exists purely so `tools/build-control`'s
# tests actually run somewhere instead of only on a laptop.
#
# Read-only: no secrets, no checkout of anything but the PR's own diff, no
# write permission, no merge/deploy/migration/model call.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-control-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: build-control-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests, including the workflow-guards structural checks
        run: npx vitest run tools/build-control --reporter=verbose

      - name: Confirm the run changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::CI modified the working tree. It must not."
            git status --porcelain
            exit 1
          fi
