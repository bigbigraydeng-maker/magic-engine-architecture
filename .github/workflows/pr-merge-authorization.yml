name: PR Merge Authorization

# Preventive merge control: a non-draft PR's exact current revision does not
# receive this required check until the protected GitHub Environment is
# approved. Configure `merge-authorization` with Ray as the sole required
# reviewer and disable administrator bypass before making this check required.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-merge-authorization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-authorization:
    name: Merge authorization (Ray)
    if: github.event.pull_request.draft == false
    environment:
      name: merge-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind approval receipt to this PR revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER}"
          test "${#PR_HEAD_SHA}" -eq 40
          {
            echo '## Merge authorization receipt'
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Approved head: \`${PR_HEAD_SHA}\`"
            echo '- Authority: protected GitHub Environment review'
          } >> "${GITHUB_STEP_SUMMARY}"
