name: OPS — Auto-fix blast radius guard

# The deterministic half of the Codex-to-Claude auto-fix containment.
#
# ops-codex-to-claude-fix.yml feeds an untrusted Codex review body into a
# Claude run that commits and pushes. That prompt is fenced and the untrusted
# text is quoted as data — but a fence only relocates text, it cannot make a
# model refuse. So the prompt is NOT the security boundary. This is.
#
# It ignores the prompt entirely and judges the result: on any PR whose head
# branch is in the lane the auto-fix leg can push to, the changed files must
# stay out of the protected set (CI definitions, this loop's own control
# plane, migrations, render.yaml, kernel authorization boundaries, anything
# credential-shaped) and under a size cap. See
# tools/ops-review-loop/src/fix-scope.mjs for the list and the reasoning.
#
# Checked out from `main`, never the PR head, so a PR cannot edit the guard
# that judges it. `.github/workflows/` and `tools/ops-review-loop/` are
# themselves protected, so it cannot edit it on a later fix round either.
#
# It never merges, deploys, applies a migration, writes to production, or
# modifies the PR. Its only output is pass/fail plus a job summary.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ops-fix-scope-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check auto-fix blast radius
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node tools/ops-review-loop/src/check-fix-scope.mjs
