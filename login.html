<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Engine — Sign In</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: #060E1A;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ─── Background ─── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.bg-gradient {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(38, 82, 162, 0.28) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 15% 85%, rgba(18, 45, 95, 0.18) 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 85% 80%, rgba(18, 45, 95, 0.14) 0%, transparent 55%),
    linear-gradient(180deg, #07101E 0%, #040A12 100%);
}

/* Light rays */
.rays {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.ray {
  position: absolute;
  top: 0;
  height: 58vh;
  transform-origin: top center;
  background: linear-gradient(to bottom, rgba(90, 155, 255, 0.1), transparent);
  filter: blur(7px);
}

.ray:nth-child(1)  { left: 28%; width: 2px; transform: rotate(-22deg); opacity: .6; }
.ray:nth-child(2)  { left: 35%; width: 3px; transform: rotate(-12deg); opacity: .8; }
.ray:nth-child(3)  { left: 42%; width: 4px; transform: rotate(-5deg);  }
.ray:nth-child(4)  { left: 50%; width: 5px; transform: rotate(0deg);   }
.ray:nth-child(5)  { left: 58%; width: 4px; transform: rotate(5deg);   }
.ray:nth-child(6)  { left: 65%; width: 3px; transform: rotate(12deg);  opacity: .8; }
.ray:nth-child(7)  { left: 72%; width: 2px; transform: rotate(22deg);  opacity: .6; }
.ray:nth-child(8)  { left: 20%; width: 1px; transform: rotate(-32deg); opacity: .35; }
.ray:nth-child(9)  { left: 80%; width: 1px; transform: rotate(32deg);  opacity: .35; }

/* Floating bubbles */
@keyframes rise {
  0%   { transform: translateY(100vh) translateX(0px); opacity: 0; }
  8%   { opacity: .55; }
  88%  { opacity: .2; }
  100% { transform: translateY(-8vh) translateX(20px); opacity: 0; }
}

.bubbles { position: absolute; inset: 0; }

.b {
  position: absolute;
  border-radius: 50%;
  background: rgba(110, 175, 255, 0.35);
  animation: rise linear infinite;
}

.b:nth-child(1) { width:3px; height:3px; left:12%; animation-duration:13s; animation-delay:0s;   }
.b:nth-child(2) { width:2px; height:2px; left:28%; animation-duration:10s; animation-delay:2.5s; }
.b:nth-child(3) { width:4px; height:4px; left:45%; animation-duration:15s; animation-delay:5s;   }
.b:nth-child(4) { width:2px; height:2px; left:60%; animation-duration:11s; animation-delay:1s;   }
.b:nth-child(5) { width:3px; height:3px; left:75%; animation-duration:14s; animation-delay:3.5s; }
.b:nth-child(6) { width:2px; height:2px; left:38%; animation-duration:9s;  animation-delay:7s;   }
.b:nth-child(7) { width:3px; height:3px; left:88%; animation-duration:12s; animation-delay:0.8s; }
.b:nth-child(8) { width:2px; height:2px; left:6%;  animation-duration:16s; animation-delay:4s;   }

/* ─── Card ─── */
.card {
  position: relative;
  z-index: 10;
  width: 420px;
  max-width: calc(100vw - 36px);
  padding: 44px 40px;
  background: rgba(10, 20, 40, 0.74);
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
  border-radius: 22px;
  border: 1px solid rgba(70, 125, 215, 0.18);
  box-shadow:
    0 32px 72px rgba(0, 0, 0, 0.58),
    0 0 0 1px rgba(255, 255, 255, 0.03),
    inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

/* ─── Logo ─── */
.logo-area {
  text-align: center;
  margin-bottom: 30px;
}

.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 13px;
  filter: drop-shadow(0 2px 22px rgba(50, 110, 220, 0.45));
}

.product-name {
  font-size: 21px;
  font-weight: 700;
  color: #EFF5FF;
  letter-spacing: 0.2px;
  margin-bottom: 5px;
}

.product-tagline {
  font-size: 10.5px;
  letter-spacing: 3.8px;
  color: rgba(120, 170, 230, 0.48);
  text-transform: uppercase;
  font-weight: 400;
}

/* ─── Sep ─── */
.sep {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(70, 130, 220, 0.28), transparent);
  margin: 0 0 26px;
}

/* ─── Heading ─── */
.heading { margin-bottom: 22px; }

.heading h1 {
  font-size: 17px;
  font-weight: 600;
  color: #ECF3FF;
  margin-bottom: 4px;
}

.heading p {
  font-size: 13px;
  color: rgba(120, 170, 230, 0.52);
}

/* ─── Fields ─── */
.field { margin-bottom: 15px; }

.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(165, 200, 250, 0.72);
  margin-bottom: 7px;
  letter-spacing: 0.2px;
}

.fi { position: relative; }

.fi-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(75, 130, 215, 0.5);
  display: flex;
  align-items: center;
  pointer-events: none;
}

.fi input {
  width: 100%;
  padding: 12px 14px 12px 40px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(70, 125, 215, 0.2);
  border-radius: 10px;
  color: #EEF4FF;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}

.fi input::placeholder { color: rgba(120, 170, 235, 0.26); }

.fi input:focus {
  border-color: rgba(65, 125, 220, 0.65);
  background: rgba(55, 105, 200, 0.07);
  box-shadow: 0 0 0 3px rgba(55, 105, 200, 0.1);
}

/* ─── Forgot ─── */
.row-forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -8px;
  margin-bottom: 20px;
}

.row-forgot a {
  font-size: 12px;
  color: rgba(95, 155, 240, 0.62);
  text-decoration: none;
  transition: color .2s;
}

.row-forgot a:hover { color: #7ABFFF; }

/* ─── Primary button ─── */
.btn-primary {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #2855A4 0%, #183572 100%);
  border: 1px solid rgba(75, 135, 225, 0.32);
  border-radius: 10px;
  color: #EEF4FF;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  transition: transform .15s, box-shadow .2s, background .2s;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 60%);
  pointer-events: none;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #3162BA 0%, #20448C 100%);
  box-shadow: 0 6px 22px rgba(38, 85, 175, 0.42);
  transform: translateY(-1px);
}

.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .6; cursor: default; transform: none; }

/* ─── OR row ─── */
.or-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0;
}

.or-row::before,
.or-row::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(70, 125, 215, 0.18);
}

.or-row span {
  font-size: 11.5px;
  color: rgba(120, 170, 230, 0.35);
  white-space: nowrap;
}

/* ─── Secondary button ─── */
.btn-secondary {
  width: 100%;
  padding: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(70, 125, 215, 0.19);
  border-radius: 10px;
  color: rgba(185, 215, 252, 0.72);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background .2s, border-color .2s, color .2s;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(70, 125, 215, 0.34);
  color: rgba(210, 230, 255, 0.9);
}

/* ─── Card footer ─── */
.card-foot {
  text-align: center;
  margin-top: 24px;
  font-size: 12.5px;
  color: rgba(120, 170, 230, 0.42);
}

.card-foot a {
  color: rgba(95, 158, 245, 0.72);
  text-decoration: none;
  font-weight: 500;
  transition: color .2s;
}

.card-foot a:hover { color: #7ABFFF; }

/* ─── Page footer ─── */
.page-foot {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: rgba(70, 115, 185, 0.28);
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 10;
  white-space: nowrap;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg">
  <div class="bg-gradient"></div>
  <div class="rays">
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
  </div>
  <div class="bubbles">
    <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
    <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
  </div>
</div>

<!-- Login card -->
<div class="card">

  <!-- Logo -->
  <div class="logo-area">
    <div class="logo-mark">
      <!--
        Magic Lab "M" mark — geometric approximation:
        two diagonal bars forming the M silhouette + 4-pointed star sparkle
      -->
      <svg width="68" height="64" viewBox="0 0 68 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 4-pointed star (upper right) -->
        <path d="M53 3 L54.3 7.2 L58.5 8.5 L54.3 9.8 L53 14 L51.7 9.8 L47.5 8.5 L51.7 7.2 Z"
              fill="rgba(240,248,255,0.95)"/>

        <!-- M shape — 4 filled polygons -->
        <!-- Left outer leg -->
        <polygon points="3,60 13,6 22,6 12,60" fill="#9ABDE0"/>
        <!-- Left inner (slopes to V-bottom) -->
        <polygon points="13,6 22,6 33,38 24,38" fill="#789EC8"/>
        <!-- Right inner (slopes from V-bottom) -->
        <polygon points="46,6 55,6 44,38 35,38" fill="#789EC8"/>
        <!-- Right outer leg -->
        <polygon points="46,6 55,6 65,60 55,60" fill="#9ABDE0"/>
        <!-- V-bottom connector -->
        <polygon points="24,38 33,38 34,48 35,38 44,38 34,60" fill="#587FAF"/>
      </svg>
    </div>
    <div class="product-name">Magic Engine</div>
    <div class="product-tagline">AI · Automation · Future</div>
  </div>

  <div class="sep"></div>

  <div class="heading">
    <h1>Welcome back</h1>
    <p>Sign in to your workspace</p>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)" novalidate>

    <div class="field">
      <label for="email">Email address</label>
      <div class="fi">
        <span class="fi-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </span>
        <input type="email" id="email" placeholder="name@company.com"
               autocomplete="email" required />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="fi">
        <span class="fi-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="password" placeholder="••••••••"
               autocomplete="current-password" required />
      </div>
    </div>

    <div class="row-forgot">
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-primary" id="submit-btn" type="submit">Sign In</button>

    <div class="or-row"><span>or continue with</span></div>

    <button class="btn-secondary" type="button">
      <!-- Google icon -->
      <svg width="17" height="17" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

  </form>

  <div class="card-foot">
    Don't have an account? <a href="#">Request access</a>
  </div>

</div>

<div class="page-foot">Magic Lab &copy; 2026</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) return;

  btn.textContent = 'Signing in…';
  btn.disabled = true;

  // Simulated auth delay — replace with real fetch() call
  setTimeout(() => {
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }, 2000);
}
</script>

</body>
</html>
