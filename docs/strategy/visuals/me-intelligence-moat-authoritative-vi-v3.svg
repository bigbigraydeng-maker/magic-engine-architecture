  <rect x="684" y="365" width="216" height="76" rx="13" fill="#1A1A1A" stroke="#3B3936"/><text x="704" y="397" fill="#EBCB8B">02 · EVIDENCE GRAPH</text><text x="704" y="423" fill="#FBF8F3">跨渠道证据标准化</text>
