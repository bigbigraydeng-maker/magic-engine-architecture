  <circle cx="620" cy="550" r="43" fill="#FBF8F3"/><text x="620" y="546" text-anchor="middle" font-size="31" fill="url(#gold)">M</text><text x="620" y="571" text-anchor="middle" font-size="13" fill="#1A1A1A">衡量</text>
  <circle cx="740" cy="550" r="43" fill="#FBF8F3"/><text x="740" y="546" text-anchor="middle" font-size="31" fill="url(#gold)">P</text><text x="740" y="571" text-anchor="middle" font-size="13" fill="#1A1A1A">决策</text>
  <circle cx="860" cy="550" r="43" fill="#FBF8F3"/><text x="860" y="546" text-anchor="middle" font-size="31" fill="url(#gold)">A</text><text x="860" y="571" text-anchor="middle" font-size="13" fill="#1A1A1A">执行</text>
  <circle cx="980" cy="550" r="43" fill="#FBF8F3"/><text x="980" y="546" text-anchor="middle" font-size="31" fill="url(#gold)">C</text><text x="980" y="571" text-anchor="middle" font-size="13" fill="#1A1A1A">验证</text>
  <circle cx="1100" cy="550" r="43" fill="url(#gold)"/><text x="1100" y="546" text-anchor="middle" font-size="31" fill="#0D0D0D">T</text><text x="1100" y="571" text-anchor="middle" font-size="13" fill="#0D0D0D">调优</text>
