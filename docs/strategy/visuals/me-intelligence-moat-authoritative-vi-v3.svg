  <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#1A1A1A"/></marker>
  <style>
    .d{font-family:'Space Grotesk','Noto Sans SC','PingFang SC',sans-serif}.u{font-family:Inter,'Noto Sans SC','PingFang SC',sans-serif}.h{font-weight:600;fill:#1A1A1A}.cap{font-size:13px;letter-spacing:2px;fill:#C4912E}.body{font-size:17px;fill:#1A1A1A}.muted{fill:#716C64}.card{fill:#fff;stroke:#EAE6DF;stroke-width:2}.gold{fill:#C4912E}
  </style>
</defs>
<rect width="1600" height="900" fill="#FBF8F3"/>
<image href="brand/logo-horizontal.svg" x="50" y="28" width="260" height="59"/>
